[project]
name = "ap-logging"
version = "0.1.0"
requires-python = ">=3.12"
description = "Structured logging setup for the Anomaly Platform"
dependencies = [
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_logging"]
