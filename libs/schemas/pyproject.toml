[project]
name = "ap-schemas"
version = "0.1.0"
requires-python = ">=3.12"
description = "Shared Pydantic schemas for the Anomaly Platform"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_schemas"]
