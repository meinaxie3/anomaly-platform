[project]
name = "ap-dashboard-api"
version = "0.1.0"
requires-python = ">=3.12"
description = "FastAPI dashboard API — serves aggregated metrics, incidents, and model health to the React frontend"
dependencies = [
    "ap-schemas",
    "ap-logging",
    # Phase 5 additions: fastapi, uvicorn, asyncpg / sqlalchemy
]

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_api"]
