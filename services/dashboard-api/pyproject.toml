[project]
name = "ap-dashboard-api"
version = "0.1.0"
requires-python = ">=3.12"
description = "FastAPI dashboard API -- serves aggregated metrics, incidents, and model health to the React frontend"
dependencies = [
    "ap-schemas",
    "ap-logging",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.21",
]

[project.scripts]
dashboard = "dashboard_api.main:main"

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_api"]
