[project]
name = "ap-inference"
version = "0.1.0"
requires-python = ">=3.12"
description = "FastAPI inference service — scores incoming metric batches against per-service models"
dependencies = [
    "ap-schemas",
    "ap-logging",
    # Phase 4 additions: fastapi, uvicorn, scikit-learn, joblib
]

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]
