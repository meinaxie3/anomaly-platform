[project]
name = "ap-alerts"
version = "0.1.0"
requires-python = ">=3.12"
description = "Alert engine — groups anomalies into incidents and applies suppression rules"
dependencies = [
    "ap-schemas",
    "ap-logging",
    # Phase 4 additions
    "asyncpg>=0.30",
    "redis[hiredis]>=5.2",
    "pydantic-settings>=2.6",
]

[project.scripts]
alerts = "alerts.main:main"

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts"]
