[project]
name = "ap-training"
version = "0.1.0"
requires-python = ">=3.12"
description = "Scheduled training job — fits per-service anomaly models and writes versioned artifacts to MinIO"
dependencies = [
    "ap-schemas",
    "ap-logging",
    # Phase 3 additions
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
    "boto3>=1.36",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "pydantic-settings>=2.6",
]

[project.scripts]
training = "training.main:main"

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
