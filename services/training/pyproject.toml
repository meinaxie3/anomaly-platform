[project]
name = "ap-training"
version = "0.1.0"
requires-python = ">=3.12"
description = "Scheduled training job — fits per-service anomaly models and writes versioned artifacts to MinIO"
dependencies = [
    "ap-schemas",
    "ap-logging",
    # Phase 3 additions: scikit-learn, prophet / statsmodels, pandas, joblib, minio
]

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
