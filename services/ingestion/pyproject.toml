[project]
name = "ap-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
description = "FastAPI ingestion API — validates MetricEvents and enqueues them to Redis Streams"
dependencies = [
    "ap-schemas",
    "ap-logging",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis[hiredis]>=5.2",
    "pydantic-settings>=2.7",
]

[project.scripts]
ingestion = "ingestion.main:run"

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
