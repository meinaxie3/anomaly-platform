[project]
name = "ap-consumer"
version = "0.1.0"
requires-python = ">=3.12"
description = "Redis Stream consumer — reads MetricEvents and batch-writes to TimescaleDB"
dependencies = [
    "ap-schemas",
    "ap-logging",
    "redis[hiredis]>=5.2",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
]

[project.scripts]
consumer = "consumer.main:main_sync"

[tool.uv.sources]
ap-schemas = { workspace = true }
ap-logging  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer"]
